name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      TZ: Europe/London
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: API regression tests
        working-directory: signup-api
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Website regression tests
        run: |
          node --test scripts/test-*.cjs
          python3 scripts/test-seo-templates.py
          python3 scripts/test-ebay-copy.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          asset_name="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          direct_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${asset_name}"

          if ! curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            --output "${archive}" "${direct_url}"; then
            echo "Direct Hugo download failed; using the GitHub Releases API fallback."
            asset_api_url="$(
              curl --fail --location --silent --show-error \
                --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/gohugoio/hugo/releases/tags/v${HUGO_VERSION}" |
              python3 -c 'import json, sys; name = sys.argv[1]; data = json.load(sys.stdin); print(next((asset["url"] for asset in data["assets"] if asset["name"] == name), ""))' \
                "${asset_name}"
            )"
            test -n "${asset_api_url}"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "${archive}" "${asset_api_url}"
          fi

          test -s "${archive}"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xzf "${archive}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "https://dokkadoki.co.uk/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Rendered SEO regression tests
        run: python3 scripts/test-seo-output.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
